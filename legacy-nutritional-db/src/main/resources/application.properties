spring.application.name=legacy-nutritional-db
server.port=8080

# --- SQL : H2 en mode fichier (persistant), AUTO_SERVER permet d'ouvrir un 2e client (shell/console) en parallèle ---
spring.datasource.url=jdbc:h2:file:./data/nutrition-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Le schéma est défini par schema.sql (contrat SQL explicite) ; Hibernate se contente de le VALIDER.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8080/h2-console  (JDBC URL ci-dessus, user "sa", mot de passe vide)
spring.h2.console.enabled=true
