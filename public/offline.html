<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5A5A40" />
    <title>Saveur is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f0;
        color: #1f2937;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(90vw, 520px);
        padding: 32px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(90, 90, 64, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, serif;
        font-size: 34px;
        color: #5A5A40;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Saveur is offline</h1>
      <p>The app shell is cached, but live recipes, plans and groceries need the local server or an internet connection.</p>
    </main>
  </body>
</html>
